services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sqlwhisper
      POSTGRES_USER: sqlwhisper
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlwhisper -d sqlwhisper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
